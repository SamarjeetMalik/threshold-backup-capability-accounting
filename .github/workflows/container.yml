# Builds the reproduction container (Dockerfile) and runs the full artifact check inside it:
# 99 tests and every TLC configuration, each compared with its saved expected output.
name: container-reproduction
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: |
          set -o pipefail
          docker build -t cea-artifact . 2>&1 | tee build.log
      - name: Run reproduce_all.py inside the container
        run: |
          set -o pipefail
          docker run --rm cea-artifact 2>&1 | tee reproduce.log
          grep -q "PASS: all Python evidence, all tests" reproduce.log
      - name: Record environment
        if: always()
        run: |
          { date -u; uname -a; docker --version; docker image inspect cea-artifact --format '{{.Id}}' || true; nproc; } > environment.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-reproduction-logs
          path: |
            build.log
            reproduce.log
            environment.log
